{
  "openapi": "3.1.0",
  "info": {
    "title": "Ops API contracts",
    "version": "0.3.0",
    "description": "T03 configuration/rule commands and T05 synthetic health ingestion run in NocoBase on port 13000. The data service on port 18000 exposes health routes only; batch/job/metric operations are internal Python APIs. Other business endpoints remain pending. T03 configuration versions are integers. T05 health commands use decimal-string revisions and SHA256 over compact sorted UTF-8 JSON excluding payload_hash; the hash detects content changes, while the NocoBase bearer authenticates the caller."
  },
  "paths": {
    "/api/opsConfig:snapshot": {
      "get": {
        "x-implementation": "implemented",
        "x-contract-status": "synthetic-only",
        "servers": [
          {
            "url": "http://127.0.0.1:13000"
          }
        ],
        "description": "Returns the current integer configuration version and readable configuration within the authenticated user’s active business scope. capabilities identifies available command permissions. activeRules contains only the latest enabled immutable version for each family + store + warehouse; retiring the latest version does not reactivate an older rule. This is served by the NocoBase plugin, not FastAPI.",
        "security": [
          {
            "nocobaseBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "NocoBase response wrapper; data contains the result.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/ConfigSnapshot"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid NocoBase authentication.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "403": {
            "description": "Role or business scope does not permit the operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          }
        }
      }
    },
    "/api/opsRule:command": {
      "post": {
        "x-implementation": "implemented",
        "x-contract-status": "synthetic-only",
        "servers": [
          {
            "url": "http://127.0.0.1:13000"
          }
        ],
        "description": "Administrator or scope-authorized supervisor command. publish creates an immutable shadow version; enable and retire append a new immutable version using rule_id. Operators and integration accounts cannot publish. Scope must exist and be synthetic. Integer expected_version, audit event, snapshot version and durable receipt are committed atomically; identical retries return the original receipt and conflicts return 409. This does not evaluate rules or dispatch tasks.",
        "security": [
          {
            "nocobaseBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "NocoBase response wrapper; data contains the result.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/RuleReceipt"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid NocoBase authentication.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "403": {
            "description": "Role or business scope does not permit the operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "400": {
            "description": "Invalid command, value field, rule parameters or business scope.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "409": {
            "description": "Stale expected_version, duplicate business binding, retired rule, or command_id reused by a different caller or with different parameters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "404": {
            "description": "Referenced rule_id does not exist.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RuleCommand"
              }
            }
          }
        }
      }
    },
    "/api/opsDataHealth:ingest": {
      "post": {
        "x-implementation": "implemented",
        "description": "T05 health-only command. Requires actual ops_integration role, current scope grants and current configuration binding_version. Atomically stores a durable receipt, scope/data_type health summary and merged data issue. Older health_revision is ignored; identical retries remain authorized before returning duplicate. No business task dispatch. last_attempt_at is null if never attempted. One authoritative synthetic connection per scope/data_type; live-source projection is not enabled.",
        "security": [
          {
            "nocobaseBearer": []
          }
        ],
        "responses": {
          "400": {
            "description": "Invalid structure or hash",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "403": {
            "description": "No authorized scope; invisible object queries use the same policy",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "409": {
            "description": "Command ID content conflict or stale expected_version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          },
          "200": {
            "description": "Durable NocoBase health receipt.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "object",
                      "required": [
                        "receipt_id",
                        "command_id",
                        "status",
                        "health_revision"
                      ],
                      "properties": {
                        "receipt_id": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "command_id": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "status": {
                          "enum": [
                            "applied",
                            "duplicate",
                            "ignored_stale"
                          ]
                        },
                        "health_revision": {
                          "type": "string",
                          "pattern": "^[1-9][0-9]*$"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "ops-v1.schema.json"
              }
            }
          }
        },
        "x-payload-definition": "HealthEnvelope",
        "x-contract-status": "synthetic-only",
        "servers": [
          {
            "url": "http://127.0.0.1:13000"
          }
        ]
      }
    },
