          "409": {
            "description": "Stale expected_version, duplicate business binding, retired rule, or command_id reused by a different caller or with different parameters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NocobaseError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConfigCommand"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "internalBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Planned worker/service identity with per-binding and scope authorization; token alone is not scope authorization."
      },
      "nocobaseBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "NocoBase auth:signIn token. Roles and active store/warehouse memberships are re-read on the server. Supplying actor or roles in a request does not grant permission."
      }
    },
    "schemas": {
      "NocobaseError": {
        "type": "object",
        "required": [
          "errors"
        ],
        "properties": {
          "errors": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "message": {
                  "type": "string"
                }
              }
            }
          }
        }
      },
      "ConfigRecord": {
        "type": "object",
        "description": "Scope-filtered persisted configuration row. Native id identifies the NocoBase record; business_id/store_id/warehouse_id are stable business UUIDs. Additional readable fields depend on the collection.",
        "properties": {
          "id": {
            "type": "integer"
          },
          "business_id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer"
          },
          "environment": {
            "type": "string"
          },
          "store_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "warehouse_id": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "RuleRecord": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ConfigRecord"
          },
          {
            "type": "object",
            "properties": {
              "family": {
                "enum": [
                  "R1",
                  "R2",
                  "R3"
                ]
              },
              "status": {
                "enum": [
                  "shadow",
                  "enabled",
                  "retired"
                ]
              },
              "metric_version": {
                "type": "string"
              },
              "parameters": {
                "type": "object"
              },
              "recovery": {
                "$ref": "#/components/schemas/RecoveryParameters"
              }
            }
          }
        ]
      },
      "ConfigSnapshot": {
        "type": "object",
        "required": [
          "version",
          "capabilities",
          "opsStores",
          "opsMemberships",
          "opsWarehouseScopes",
          "opsOwnerAssignments",
          "opsRules",
          "activeRules"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "capabilities": {
            "type": "object",
            "required": [
              "manageConfig",
              "publishRules"
            ],
            "properties": {
              "manageConfig": {
                "type": "boolean"
              },
              "publishRules": {
                "type": "boolean"
              }
            }
          },
          "opsStores": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConfigRecord"
            }
          },
          "opsMemberships": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConfigRecord"
            }
          },
          "opsWarehouseScopes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConfigRecord"
            }
          },
          "opsOwnerAssignments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConfigRecord"
            }
          },
          "opsRules": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RuleRecord"
            }
          },
          "activeRules": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RuleRecord"
            }
          },
          "users": {
            "type": "array",
            "description": "Only administrators and supervisors receive the required scope-filtered user directory; absent for operators and integration accounts.",
            "items": {
              "type": "object",
              "required": [
                "id"
              ],
              "properties": {
                "id": {
                  "type": "integer",
                  "description": "Native NocoBase user ID, not a business UUID."
                },
                "nickname": {
                  "type": [
                    "string",
                    "null"
                  ]
                }
              }
            }
          }
        }
      },
      "StoreValues": {
        "type": "object",
        "properties": {
          "business_id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "environment": {
            "const": "synthetic"
          },
          "store_id": {
            "type": "string",
            "format": "uuid"
          },
          "connection_id": {
            "type": "string",
            "minLength": 1
          },
          "erp_store_id": {
            "type": "string",
            "minLength": 1
          },
          "platform": {
            "type": "string"
          },
          "site": {
            "type": "string"
          },
          "timezone": {
            "type": "string",
            "description": "Valid IANA time zone, for example UTC."
          }
        },
        "required": [
          "business_id",
          "environment",
          "store_id",
          "connection_id",
          "erp_store_id",
          "timezone"
        ],
        "additionalProperties": false,
        "description": "business_id must equal store_id. The connection_id + erp_store_id binding is unique; updates match business_id."
      },
      "MembershipValues": {
        "type": "object",
        "properties": {
          "business_id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "environment": {
            "const": "synthetic"
          },
          "store_id": {
            "type": "string",
            "format": "uuid"
          },
          "user_id": {
            "type": "integer",
            "description": "Native NocoBase user ID, not a business UUID."
          },
          "membership_role": {
            "enum": [
              "ops_supervisor",
              "ops_operator",
              "ops_integration"
            ]
          },
          "status": {
            "enum": [
              "active",
              "inactive"
            ],
            "default": "active"
          }
        },
        "required": [
          "business_id",
          "environment",
          "store_id",
          "user_id",
          "membership_role"
        ],
        "additionalProperties": false
      },
      "WarehouseScopeValues": {
        "type": "object",
        "properties": {
          "business_id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "environment": {
            "const": "synthetic"
          },
          "warehouse_id": {
            "type": "string",
            "format": "uuid"
          },
          "user_id": {
            "type": "integer",
            "description": "Native NocoBase user ID, not a business UUID."
          },
          "status": {
            "enum": [
              "active",
              "inactive"
            ],
            "default": "active"
          }
        },
        "required": [
          "business_id",
          "environment",
          "warehouse_id",
          "user_id"
        ],
        "additionalProperties": false
      },
      "OwnerAssignmentValues": {
        "type": "object",
        "properties": {
          "business_id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "environment": {
            "const": "synthetic"
          },
          "store_id": {
            "type": "string",
            "format": "uuid"
          },
          "warehouse_id": {
            "type": "string",
            "format": "uuid"
          },
          "user_id": {
            "type": "integer",
            "description": "Native NocoBase user ID, not a business UUID."
          },
          "rule_family": {
            "enum": [
              "R1",
              "R2",
              "R3"
            ]
          }
        },
        "required": [
          "business_id",
          "environment",
          "user_id",
          "rule_family"
        ],
        "additionalProperties": false,
        "anyOf": [
          {
            "required": [
              "store_id"
            ]
          },
          {
            "required": [
              "warehouse_id"
            ]
          }
        ],
        "description": "The selected user must already have every specified store and warehouse scope. This stores assignment configuration only; automatic task dispatch remains pending."
      },
      "RecoveryParameters": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "observation_hours",
          "required_complete_days"
        ],
        "properties": {
          "observation_hours": {
            "type": "integer",
            "minimum": 1,
            "maximum": 8760
          },
          "required_complete_days": {
            "type": "integer",
            "minimum": 1,
            "maximum": 366
          }
        },
        "description": "observation_hours must also be at least required_complete_days * 24; this cross-field condition is validated by the server."
      },
      "R1Parameters": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "drop_ratio",
          "min_baseline_orders"
        ],
        "properties": {
          "drop_ratio": {
            "type": "number",
            "exclusiveMinimum": 0,
            "maximum": 1
          },
          "min_baseline_orders": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "R2Parameters": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "available_qty_threshold"
        ],
        "properties": {
          "available_qty_threshold": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "R3Parameters": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "increase_ratio",
          "min_baseline_refunds"
        ],
        "properties": {
          "increase_ratio": {
            "type": "number",
            "exclusiveMinimum": 0
          },
          "min_baseline_refunds": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "ConfigReceipt": {
        "type": "object",
        "required": [
          "version",
          "saved"
        ],
        "properties": {
          "version": {
            "type": "integer"
          },
          "saved": {
            "const": true
          }
        }
      },
      "RuleReceipt": {
        "type": "object",
        "required": [
          "version",
          "rule"
        ],
        "properties": {
          "version": {
            "type": "integer"
          },
          "rule": {
            "$ref": "#/components/schemas/RuleRecord"
          }
        }
      },
      "ConfigCommand": {
        "type": "object",
        "required": [
          "command",
          "command_id",
          "expected_version",
          "reason",
          "values"
        ],
        "properties": {
          "command_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "expected_version": {
            "type": "integer",
            "description": "Exact numeric version from opsConfig:snapshot. A stale value returns 409. This is not the decimal-string revision used by pending worker envelopes."
          },
          "reason": {
            "type": "string",
            "minLength": 1
          },
          "command": {
            "enum": [
              "saveStore",
              "saveMembership",
              "saveWarehouseScope",
              "saveOwnerAssignment"
            ]
          },
          "values": {
            "type": "object"
          }
        },
        "oneOf": [
          {
            "properties": {
              "command": {
                "const": "saveStore"
              },
              "values": {
                "$ref": "#/components/schemas/StoreValues"
              }
            }
          },
          {
            "properties": {
              "command": {
                "const": "saveMembership"
              },
              "values": {
                "$ref": "#/components/schemas/MembershipValues"
              }
            }
          },
          {
            "properties": {
              "command": {
                "const": "saveWarehouseScope"
              },
              "values": {
                "$ref": "#/components/schemas/WarehouseScopeValues"
              }
            }
          },
          {
            "properties": {
              "command": {
                "const": "saveOwnerAssignment"
              },
              "values": {
                "$ref": "#/components/schemas/OwnerAssignmentValues"
              }
            }
          }
        ]
      },
      "RuleCommand": {
        "type": "object",
        "required": [
          "command",
          "command_id",
          "expected_version",
          "reason"
        ],
        "properties": {
          "command_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "expected_version": {
            "type": "integer",
            "description": "Exact numeric version from opsConfig:snapshot. A stale value returns 409. This is not the decimal-string revision used by pending worker envelopes."
          },
          "reason": {
            "type": "string",
            "minLength": 1
          },
          "command": {
            "enum": [
              "publish",
              "enable",
              "retire"
            ]
          },
          "rule_id": {
            "type": "integer",
            "description": "Native id of a previous immutable rule row, required for enable/retire."
          },
          "store_id": {
            "type": "string",
            "format": "uuid"
          },
          "warehouse_id": {
            "type": "string",
            "format": "uuid"
          },
          "family": {
            "enum": [
              "R1",
              "R2",
              "R3"
            ]
          },
          "metric_version": {
            "type": "string",
            "minLength": 1
          },
          "environment": {
            "const": "synthetic"
          },
          "parameters": {
            "type": "object"
          },
          "recovery": {
            "$ref": "#/components/schemas/RecoveryParameters"
          }
        },
        "oneOf": [
          {
            "properties": {
              "command": {
                "const": "publish"
              }
            },
            "required": [
              "family",
              "metric_version",
              "parameters",
              "recovery",
              "environment"
            ],
            "anyOf": [
              {
                "required": [
                  "store_id"
                ]
              },
              {
                "required": [
                  "warehouse_id"
                ]
              }
            ],
            "oneOf": [
              {
                "properties": {
                  "family": {
                    "const": "R1"
                  },
                  "parameters": {
                    "$ref": "#/components/schemas/R1Parameters"
                  }
                },
                "required": [
                  "store_id"
                ]
              },
              {
                "properties": {
                  "family": {
                    "const": "R2"
                  },
                  "parameters": {
                    "$ref": "#/components/schemas/R2Parameters"
                  }
                }
              },
              {
                "properties": {
                  "family": {
                    "const": "R3"
                  },
                  "parameters": {
                    "$ref": "#/components/schemas/R3Parameters"
                  }
                },
                "required": [
                  "store_id"
                ]
              }
            ]
          },
          {
            "properties": {
              "command": {
                "enum": [
                  "enable",
                  "retire"
                ]
              }
            },
            "required": [
              "rule_id"
            ]
          }
        ]
      }
    }
  },
  "servers": [
    {
      "url": "http://127.0.0.1:18000"
    }
  ]
}
